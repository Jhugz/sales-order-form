<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Order Form</title>
<style>
  :root{
    --paper:#F7F2E4;
    --card:#FFFFFF;
    --ink:#1E2A5E;
    --ink-soft:#5B6580;
    --line:#E2D9C4;
    --line-dash:#CDBF9C;
    --gold:#9A6B0C;
    --gold-soft:#FBEACB;
    --danger:#B8433C;
    --danger-soft:#F6E4E2;
    --ok:#2E7D5B;
    --ok-soft:#E3F1EA;
    --font-display: Georgia, 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 420px at 50% 0%, #FDF6E4 0%, #F7F2E4 55%, #F2ECDC 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--font-body);
    padding:24px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  .brand-header{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px 24px 16px;
    text-align:center;
    margin-bottom:4px;
    box-shadow:0 1px 0 var(--gold-soft) inset;
  }
  .brand-logo-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .company-logo {
    width: 32px;
    height: 32px;
    background: var(--ink);
    color: #fff;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: bold;
    font-size: 16px;
  }
  .brand-logo-text {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: bold;
    color: var(--ink);
    letter-spacing: 1px;
    margin: 0;
  }
  .tabs{display:flex;gap:8px;margin-top:18px;}
  .tab-btn{
    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    padding:8px 14px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    border-radius:6px;
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px 22px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:var(--font-display);
    font-size:16px;
    margin:0 0 14px;
    color:var(--ink);
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
  }
  label{
    display:block;
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  select, input[type=text], input[type=number], input[type=password], textarea{
    width:100%;
    font-family:var(--font-body);
    font-size:14px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
  }
  select:focus, input:focus, textarea:focus{
    outline:none;
    border-color:var(--ink);
  }
  .row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:140px;}
  
  .btn{
    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    padding:9px 14px;
    border-radius:6px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    cursor:pointer;
    white-space:nowrap;
    width:100%;
    text-align:center;
  }
  .btn:hover{opacity:0.9;}
  .btn.secondary{
    background:#fff;
    color:var(--ink);
    border:1px solid var(--line);
  }
  .btn.danger{
    background:#fff;
    color:var(--danger);
    border:1px solid var(--danger-soft);
  }
  .btn.small{padding:4px 9px;font-size:12px;width:auto;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.4px;
    color:var(--ink-soft);
    padding:6px 8px;
    border-bottom:1px solid var(--line);
  }
  td{
    padding:8px;
    border-bottom:1px solid #EEF0F3;
    vertical-align:top;
  }
  td.num, th.num{text-align:right;font-family:var(--font-mono);}
  .empty{
    text-align:center;
    color:var(--ink-soft);
    padding:24px 8px;
    font-size:13px;
  }
  .toast{
    background:var(--ok-soft);
    color:var(--ok);
    border:1px solid #BFE0CE;
    padding:10px 14px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    margin-bottom:16px;
    display:none;
  }
  .log-toolbar{
    display:flex;
    gap:10px;
    margin-bottom:14px;
    flex-wrap:wrap;
    align-items:center;
  }
  .log-toolbar input{flex:1;min-width:160px;}
  .order-block{
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:12px;
    overflow:hidden;
    background:#fff;
  }
  .order-block summary{
    list-style:none;
    cursor:pointer;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#FAFBFC;
  }
  .order-block summary::-webkit-details-marker{display:none;}
  .order-block .meta{font-size:12px;color:var(--ink-soft);}
  .order-block .cust{font-weight:700;font-family:var(--font-display);font-size:15px;}
  .order-block .amt{font-family:var(--font-mono);font-weight:700;color:var(--gold);}
  .order-block .body{padding:0 14px 14px;}
  .pill{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    padding:2px 7px;
    border-radius:10px;
    background:var(--gold-soft);
    color:var(--gold);
    margin-right:6px;
    text-transform:uppercase;
  }
  .muted{color:var(--ink-soft);font-size:12px;}
</style>
</head>
<body>

<!-- MAIN APP CONTAINER -->
<div class="wrap" id="appContainer">

  <div class="brand-header">
    <div class="brand-logo-container">
      <!-- Company Logo Placeholder: Replace icon below with <img src="your-logo.png" style="width:32px;height:32px;"> if you have an image file -->
      <div class="company-logo">SO</div>
      <h2 class="brand-logo-text">SALES ORDER FORM</h2>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabNew" onclick="switchTab('new')">New order</button>
    <button class="tab-btn" id="tabLog" onclick="switchTab('log')">Order log (<span id="logCount">0</span>)</button>
  </div>

  <div id="toast" class="toast">Order successfully submitted and logged!</div>

  <!-- NEW ORDER VIEW -->
  <div id="viewNew">
    <div class="card">
      <h2>Order details</h2>
      <div class="row">
        <div>
          <label>Salesman</label>
          <input type="text" id="salesmanName" placeholder="Your name">
        </div>
        <div>
          <label>Date</label>
          <input type="text" id="orderDate" readonly>
        </div>
      </div>
      <div class="row">
        <div style="flex:100%;">
          <label>Customer</label>
          <input type="text" id="custName" placeholder="Type customer name">
        </div>
      </div>
      <div class="row">
        <div style="flex:100%;">
          <label>Address</label>
          <input type="text" id="custAddress" placeholder="Exact delivery / billing address">
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Add product</h2>
      <div class="row">
        <div style="flex:100%;">
          <label>Product</label>
          <input type="text" id="inputProduct" placeholder="Type product name">
        </div>
      </div>
      <div class="row">
        <div>
          <label>Quantity</label>
          <input type="number" id="inputQty" value="0" min="0" step="1">
        </div>
        <div>
          <label>Unit price</label>
          <input type="number" id="inputPrice" value="0.00" min="0" step="0.01">
        </div>
      </div>
      <button class="btn" onclick="addItemToOrder()">Add item to order</button>
    </div>

    <div class="card">
      <h2>Items in this order</h2>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th style="width:45%;">Product</th>
              <th class="num" style="width:15%;">Qty</th>
              <th class="num" style="width:15%;">Price</th>
              <th class="num" style="width:20%;">Line Total</th>
              <th style="width:5%;"></th>
            </tr>
          </thead>
          <tbody id="itemsTableBody">
            <tr><td colspan="5" class="empty">No items added yet.</td></tr>
          </tbody>
        </table>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;border-top:1px solid var(--line);padding-top:12px;">
        <span style="font-weight:700;font-family:var(--font-display);">Total Amount:</span>
        <span id="grandTotal" style="font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--gold);">0.00</span>
      </div>

      <div style="margin-top:16px;">
        <label>Notes (Optional)</label>
        <textarea id="orderNotes" rows="3" placeholder="Delivery instructions, special requests, etc."></textarea>
      </div>

      <div style="display:flex;gap:10px;margin-top:16px;">
        <button class="btn secondary" style="flex:1;" onclick="resetForm()">Clear order</button>
        <button class="btn" style="flex:1;" onclick="submitOrder()">Submit order</button>
      </div>
    </div>
  </div>

  <!-- ORDER LOG VIEW -->
  <div id="viewLog" style="display:none;">
    <div class="card">
      <h2>Saved Orders Log</h2>
      <div class="log-toolbar">
        <input type="text" id="logSearch" placeholder="Search by customer name, salesman..." oninput="renderLog()">
        <button class="btn secondary small" onclick="exportCSV()">Export CSV</button>
        <button class="btn danger small" onclick="clearAllOrders()">Clear All</button>
      </div>
      <div id="logContainer">
        <!-- Logs go here -->
      </div>
    </div>
  </div>

</div>

<script>
  let currentItems = [];
  let orders = [];
  let orderCounter = 1001;

  // Master credentials to protect exports and deletions
  const AUTH_PASSCODE = "AEMC1995";

  function checkAuth() {
    const entered = prompt("Enter authorization passcode:");
    if (entered === null) {
      return false;
    }
    if (entered !== AUTH_PASSCODE) {
      alert("Incorrect passcode. Access denied.");
      return false;
    }
    return true;
  }

  // Initialize app immediately on load
  window.onload = function() {
    loadStorage();
    const options = { month: 'short', day: 'numeric', year: 'numeric' };
    document.getElementById('orderDate').value = new Date().toLocaleDateString('en-US', options);
  };

  function switchTab(tab) {
    const isNew = tab === 'new';
    document.getElementById('viewNew').style.display = isNew ? 'block' : 'none';
    document.getElementById('viewLog').style.display = isNew ? 'none' : 'block';
    document.getElementById('tabNew').classList.toggle('active', isNew);
    document.getElementById('tabLog').classList.toggle('active', !isNew);
    if (!isNew) renderLog();
  }

  function addItemToOrder() {
    const prodName = document.getElementById('inputProduct').value.trim();
    const qty = parseInt(document.getElementById('inputQty').value) || 0;
    const price = parseFloat(document.getElementById('inputPrice').value) || 0;

    if (!prodName) {
      alert("Please enter a product name.");
      document.getElementById('inputProduct').focus();
      return;
    }
    if (qty <= 0) {
      alert("Quantity must be greater than 0.");
      document.getElementById('inputQty').focus();
      return;
    }

    currentItems.push({
      name: prodName,
      qty: qty,
      price: price,
      total: qty * price
    });

    document.getElementById('inputProduct').value = '';
    document.getElementById('inputQty').value = '0';
    document.getElementById('inputPrice').value = '0.00';

    renderCurrentItems();
  }

  function renderCurrentItems() {
    const tbody = document.getElementById('itemsTableBody');
    if (currentItems.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty">No items added yet.</td></tr>`;
      document.getElementById('grandTotal').textContent = '0.00';
      return;
    }

    let html = '';
    let grandTotal = 0;
    currentItems.forEach((item, index) => {
      grandTotal += item.total;
      html += `
        <tr>
          <td>${escapeHtml(item.name)}</td>
          <td class="num">${item.qty}</td>
          <td class="num">${item.price.toFixed(2)}</td>
          <td class="num">${item.total.toFixed(2)}</td>
          <td style="text-align:center;"><button class="btn danger small" onclick="removeItem(${index})">×</button></td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
    document.getElementById('grandTotal').textContent = grandTotal.toFixed(2);
  }

  function removeItem(index) {
    currentItems.splice(index, 1);
    renderCurrentItems();
  }

  function resetForm() {
    document.getElementById('salesmanName').value = '';
    document.getElementById('custName').value = '';
    document.getElementById('custAddress').value = '';
    document.getElementById('inputProduct').value = '';
    document.getElementById('inputQty').value = '0';
    document.getElementById('inputPrice').value = '0.00';
    document.getElementById('orderNotes').value = '';
    currentItems = [];
    renderCurrentItems();
  }

  function submitOrder() {
    const custName = document.getElementById('custName').value.trim();
    if (!custName) {
      alert("Please enter the customer name.");
      document.getElementById('custName').focus();
      return;
    }
    if (currentItems.length === 0) {
      alert("Please add at least one product to the order.");
      return;
    }

    const grandTotal = currentItems.reduce((acc, item) => acc + item.total, 0);

    const orderObj = {
      id: orderCounter++,
      date: document.getElementById('orderDate').value,
      timestamp: new Date().toISOString(),
      salesman: document.getElementById('salesmanName').value.trim() || 'N/A',
      customer: custName,
      address: document.getElementById('custAddress').value.trim() || 'N/A',
      notes: document.getElementById('orderNotes').value.trim(),
      items: [...currentItems],
      total: grandTotal
    };

    orders.unshift(orderObj);
    saveStorage();

    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 3500);

    resetForm();
  }

  function loadStorage() {
    const saved = localStorage.getItem('orderpad_orders_v2');
    if (saved) {
      try { orders = JSON.parse(saved); } catch(e) { orders = []; }
    }
    const savedCounter = localStorage.getItem('orderpad_counter_v2');
    if (savedCounter) {
      orderCounter = parseInt(savedCounter, 10);
    }
    updateLogCount();
  }

  function saveStorage() {
    localStorage.setItem('orderpad_orders_v2', JSON.stringify(orders));
    localStorage.setItem('orderpad_counter_v2', orderCounter);
    updateLogCount();
  }

  function updateLogCount() {
    document.getElementById('logCount').textContent = orders.length;
  }

  function renderLog() {
    const container = document.getElementById('logContainer');
    const query = document.getElementById('logSearch').value.toLowerCase();
    
    const filtered = orders.filter(o => 
      o.customer.toLowerCase().includes(query) || 
      o.salesman.toLowerCase().includes(query) ||
      String(o.id).includes(query)
    );

    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty">No matching orders found.</div>`;
      return;
    }

    let html = '';
    filtered.forEach(o => {
      html += `
        <details class="order-block">
          <summary>
            <div>
              <span class="cust">Order #${o.id} - ${escapeHtml(o.customer)}</span>
              <div class="meta">Salesman: ${escapeHtml(o.salesman)} &bull; ${o.date}</div>
            </div>
            <div style="text-align:right;">
              <span class="pill">Submitted</span>
              <span class="amt">${o.total.toFixed(2)}</span>
            </div>
          </summary>
          <div class="body">
            <p class="muted" style="margin:6px 0;"><strong>Address:</strong> ${escapeHtml(o.address)}</p>
            ${o.notes ? `<p class="muted" style="margin:6px 0;"><strong>Notes:</strong> ${escapeHtml(o.notes)}</p>` : ''}
            <table style="margin-top:10px;">
              <thead>
                <tr>
                  <th>Product</th>
                  <th class="num">Qty</th>
                  <th class="num">Price</th>
                  <th class="num">Line Total</th>
                </tr>
              </thead>
              <tbody>
                ${o.items.map(i => `
                  <tr>
                    <td>${escapeHtml(i.name)}</td>
                    <td class="num">${i.qty}</td>
                    <td class="num">${i.price.toFixed(2)}</td>
                    <td class="num">${i.total.toFixed(2)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
            <div style="text-align:right; margin-top:10px;">
              <button class="btn danger small" onclick="deleteOrder(${o.id})">Delete Order</button>
            </div>
          </div>
        </details>
      `;
    });
    container.innerHTML = html;
  }

  function deleteOrder(id) {
    if (!checkAuth()) return;
    if (confirm(`Are you sure you want to delete order #${id}?`)) {
      orders = orders.filter(o => o.id !== id);
      saveStorage();
      renderLog();
    }
  }

  function clearAllOrders() {
    if (!checkAuth()) return;
    if (confirm("Are you sure you want to clear all saved logs?")) {
      orders = [];
      saveStorage();
      renderLog();
    }
  }

  function exportCSV() {
    if (!checkAuth()) return;
    if (orders.length === 0) {
      alert("No orders available to export.");
      return;
    }

    let csvContent = "Order ID,Date,Salesman,Customer,Address,Product,Quantity,Unit Price,Line Total,Order Notes\r\n";

    orders.forEach(o => {
      o.items.forEach(i => {
        const row = [
          o.id,
          `"${o.date}"`,
          `"${escapeCsv(o.salesman)}"`,
          `"${escapeCsv(o.customer)}"`,
          `"${escapeCsv(o.address)}"`,
          `"${escapeCsv(i.name)}"`,
          i.qty,
          i.price.toFixed(2),
          i.total.toFixed(2),
          `"${escapeCsv(o.notes)}"`
        ];
        csvContent += row.join(",") + "\r\n";
      });
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const dlAnchor = document.createElement('a');
    dlAnchor.setAttribute("href", url);
    dlAnchor.setAttribute("download", "sales_orders_report.csv");
    document.body.appendChild(dlAnchor);
    dlAnchor.click();
    dlAnchor.remove();
  }

  function escapeCsv(str) {
    return (str || '').replace(/"/g, '""');
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
</script>
</body>
</html>
